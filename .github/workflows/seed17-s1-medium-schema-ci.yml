name: Seed17 invented intermediate S1 schema probe
on:
  push:
    branches:
      - research/seed17-provider-ci-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-medium-s1:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One non-benchmark intermediate-schema model request
        run: python tools/ci_probe_s1_medium_schema.py
