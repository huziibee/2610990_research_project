name: Seed17 current responseFormat invented diagnostic

on:
  push:
    branches:
      - research/seed17-responseformat-diagnostic-20261020
    paths:
      - .github/workflows/seed17-responseformat-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed17-responseformat-invented-provider
  cancel-in-progress: false

jobs:
  current-format-no-production-change:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline transport equivalence tests
        run: python -m unittest tests.test_seed17_response_format_diagnostic -v
      - name: Confirm repository secret configured
        run: test -n "$GEMINI_API_KEY"
      - name: Test unchanged full goal schema via current responseFormat
        id: goal
        continue-on-error: true
        run: python tools/diagnose_seed17_response_format.py --case goal_contract --live-synthetic --output runs/provider_diagnostics/current_format_goal_${{ github.run_id }}
      - name: Test unchanged full S0 task schema via current responseFormat
        id: direct
        continue-on-error: true
        run: python tools/diagnose_seed17_response_format.py --case direct_initial_contract --live-synthetic --output runs/provider_diagnostics/current_format_direct_${{ github.run_id }}
      - name: Summarize genuine outcomes without logging source text
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file in sorted(Path("runs/provider_diagnostics").glob("current_format_*/result.json")):
              try:
                  r=json.loads(file.read_text(encoding="utf-8"))
                  print("CURRENT_FORMAT_PROVIDER_PROBE",json.dumps({k:r.get(k) for k in
                      ("case","status","error_code","http_status","provider_diagnostics",
                       "full_schema_preserved","protected_predictions_executed")},sort_keys=True))
              except (OSError,ValueError):
                  print("PROBE_RECORD_MISSING_OR_INVALID")
          PY
      - name: Preserve invented-only provider receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed17-current-responseformat-${{ github.run_id }}
          path: runs/provider_diagnostics/current_format_*/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when either official schema translation fails
        if: always()
        run: |
          echo "PROTECTED_PREDICTIONS_EXECUTED=FALSE"
          echo "This diagnostic does NOT authorize a change in the frozen protocol."
          test "${{ steps.goal.outcome }}" = "success"
          test "${{ steps.direct.outcome }}" = "success"
