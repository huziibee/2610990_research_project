name: Seed17 private approved reference validation
on:
  push:
    branches: [research/seed17-private-release-recheck-20261020]
    paths: [.github/workflows/seed17-private-release-check.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: seed17-private-reference-validation
  cancel-in-progress: false
jobs:
  private-reference-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Exact original archive bytes, secure staging and relocation tests
        run: python -m unittest tests.test_seed17_archive_git_bytes tests.test_seed17_private_staging tests.test_seed17_portable_source_replay -v
      - name: Restore original references only when original private key is available
        env:
          AUTHOR_REVIEW_AES_KEY_BASE64: ${{ secrets.AUTHOR_REVIEW_AES_KEY_BASE64 }}
        run: python tools/stage_seed17_private_release.py
      - name: Explicit non-execution statement
        if: always()
        run: |
          echo 'REFERENCE_VALIDATION_ONLY: no generation key, no model API calls, no protected predictions, no authorization.'
      # No artifact upload. Original key and decrypted reference contents never
      # leave the ephemeral runner or become visible to generation jobs.
