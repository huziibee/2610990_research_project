name: Seed17 invented supported Gemini structured schema probe

on:
  push:
    branches:
      - research/seed17-supported-structured-model-probe-20261020
    paths:
      - .github/workflows/seed17-supported-models-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed17-supported-structured-models-invented
  cancel-in-progress: false

jobs:
  invented-structured-model-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Confirm original full-schema preserved
        run: python -m unittest tests.test_seed17_supported_models_probe -v
      - name: Check secret exists
        run: test -n "$GEMINI_API_KEY"
      - name: Gemini 3.5 Flash-Lite full-schema goal
        id: lite_goal
        continue-on-error: true
        run: python tools/diagnose_seed17_supported_models.py --model gemini-3.5-flash-lite --case goal_contract --live-synthetic --output runs/provider_diagnostics/official_lite_goal_${{ github.run_id }}
      - name: Gemini 3.5 Flash-Lite full-schema direct
        id: lite_direct
        continue-on-error: true
        run: python tools/diagnose_seed17_supported_models.py --model gemini-3.5-flash-lite --case direct_initial_contract --live-synthetic --output runs/provider_diagnostics/official_lite_direct_${{ github.run_id }}
      - name: Gemini 3.8 Flash full-schema goal
        id: flash_goal
        continue-on-error: true
        run: python tools/diagnose_seed17_supported_models.py --model gemini-3.8-flash --case goal_contract --live-synthetic --output runs/provider_diagnostics/official_flash_goal_${{ github.run_id }}
      - name: Gemini 3.8 Flash full-schema direct
        id: flash_direct
        continue-on-error: true
        run: python tools/diagnose_seed17_supported_models.py --model gemini-3.8-flash --case direct_initial_contract --live-synthetic --output runs/provider_diagnostics/official_flash_direct_${{ github.run_id }}
      - name: Truthful invented-only result summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('runs/provider_diagnostics').glob('official_*/result.json')):
              result=json.loads(path.read_text(encoding='utf-8'))
              fields=('case','model','status','code','http_status','finish_reasons','usage_metadata','readiness',
                      'model_version','provider_diagnostics','original_complete_schema_preserved')
              print('MODEL_COMPARISON',json.dumps({f:result.get(f) for f in fields},sort_keys=True))
          print('NO_PROTECTED_DATA; UNREGISTERED_COMPARISON; NO_FREEZE_EVIDENCE')
          PY
      - name: Archive full invented-only attempt records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed17-supported-models-invented-${{ github.run_id }}
          path: runs/provider_diagnostics/official_*/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail if no model passed both stages
        if: always()
        run: |
          lite_ok=false
          flash_ok=false
          if [ "${{ steps.lite_goal.outcome }}" = success ] && [ "${{ steps.lite_direct.outcome }}" = success ]; then lite_ok=true; fi
          if [ "${{ steps.flash_goal.outcome }}" = success ] && [ "${{ steps.flash_direct.outcome }}" = success ]; then flash_ok=true; fi
          echo "Gemini 3.5 Flash-Lite both stages: $lite_ok"
          echo "Gemini 3.8 Flash both stages: $flash_ok"
          test "$lite_ok" = true -o "$flash_ok" = true
