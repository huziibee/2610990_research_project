name: Seed17 canonical JSON validation candidate
on:
  push:
    branches: [research/seed17-fasttrack-codec-20261020]
    paths: [.github/workflows/seed17-fasttrack-canonical-json.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: seed17-fasttrack-canonical-json
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OUT: runs/provider_diagnostics/canonical_json_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Output contract tests and full isolated-oracle mock
        run: |
          python -m unittest tests.test_seed17_canonical_json -v
          python tools/probe_seed17_canonical_json.py --mock --attempts 1 --output runs/provider_diagnostics/canonical_mock_${{ github.run_id }}
      - name: Real current-model canonical JSON two-answer candidate
        id: live
        continue-on-error: true
        run: python tools/probe_seed17_canonical_json.py --attempts 1 --output "$OUT"
      - name: Summarize actual trajectories and provider failures
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          f=Path(os.environ['OUT'])/'summary.json'
          print('CANONICAL_JSON_LIVE',f.read_text() if f.is_file() else 'MISSING')
          print('PROTECTED_PREDICTIONS=0; REGISTERED_PROTOCOL_UNCHANGED=True')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-canonical-json-${{ github.run_id }}
          path: |
            runs/provider_diagnostics/canonical_json_${{ github.run_id }}/
            runs/provider_diagnostics/canonical_mock_${{ github.run_id }}/
          retention-days: 14
      - name: Reject incomplete candidate
        if: always()
        run: test '${{ steps.live.outcome }}' = 'success'
