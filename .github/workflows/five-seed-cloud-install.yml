name: Verify native-secret cloud checkpoint launcher
on:
  push:
    branches: [research/five-seed-finalization-20261020]
    paths: [.github/workflows/five-seed-cloud-install.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: five-seed-cloud-launcher-install
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.17'}
      - run: python -m pip install -r requirements.txt
      - name: Apply exact four-file public workflow-infrastructure patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,os,re,subprocess
          from pathlib import Path
          from urllib.request import Request,urlopen
          from research.five_seed_config import fingerprints
          before=fingerprints(Path.cwd())
          repo='huziibee/2610990_research_project';blob='bcfc0f1d7534f5351a48a74d6c290b397001804a'
          assert os.environ['GITHUB_REPOSITORY']==repo
          req=Request(f'https://api.github.com/repos/{repo}/git/blobs/{blob}',headers={
              'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urlopen(req,timeout=30) as f:data=json.load(f)
          raw=base64.b64decode(data['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==blob
          assert len(raw)==9964
          assert hashlib.sha256(raw).hexdigest()=='6029c3c685141d7408d7d616ff39ddfa74f8adb5a7868a8e11c1cc0f3b9e2ea0'
          patch=lzma.decompress(raw,memlimit=134217728)
          assert len(patch)==34258
          assert hashlib.sha256(patch).hexdigest()=='2e22405d7f15a83786920286307847a87e757ccfc3886d0e682eec306ef66656'
          allowed=['.github/scripts/cloud_checkpoint.py','.github/scripts/test_cloud_checkpoint.py',
              '.github/workflows/five-seed-authorized-execution.yml','.github/FIVE_SEED_CLOUD.md']
          found=re.findall(r'^diff --git a/(\S+) b/(\S+)$',patch.decode(),re.M)
          assert len(found)==4 and {a for a,b in found}==set(allowed) and all(a==b for a,b in found)
          file=Path('/tmp/five-seed-cloud-launcher.patch');file.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(file)],check=True)
          subprocess.run(['git','apply',str(file)],check=True)
          assert fingerprints(Path.cwd())==before
          Path('/tmp/cloud-launcher-paths.json').write_text(json.dumps(allowed))
          Path('/tmp/qualified-scientific-fingerprints.json').write_text(json.dumps(before,sort_keys=True))
          print('WORKFLOW_INFRASTRUCTURE_APPLIED; qualified scientific inventory unchanged')
          PY
      - name: Encryption, tampering, lease, native-key, duplicate-cleanup and no-overwrite tests
        run: python -m unittest discover -s .github/scripts -p test_cloud_checkpoint.py -v
      - name: Preserve the scientific inventory and publish exact tested infrastructure only
        run: |
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          from research.five_seed_config import fingerprints
          branch='research/five-seed-finalization-20261020'
          before=json.loads(Path('/tmp/qualified-scientific-fingerprints.json').read_text())
          assert fingerprints(Path.cwd())==before
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert head==os.environ['GITHUB_SHA']
          remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/'+branch],text=True).split()[0]
          if remote!=head:raise SystemExit('Branch advanced; refusing overwrite')
          paths=json.loads(Path('/tmp/cloud-launcher-paths.json').read_text())
          subprocess.run(['git','add','--',*paths],check=True)
          actual=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(actual)==set(paths)
          subprocess.run(['git','-c','core.whitespace=cr-at-eol','diff','--cached','--check'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Add tested native-secret cloud checkpoints through authorized real five-seed results'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          print('CLOUD_LAUNCHER_PUBLISHED',subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip())
          print('No model requests or private reference decryption occurred in this job.')
          PY
