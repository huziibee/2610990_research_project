name: Seed17 current isolated live judge calibration
on:
  push:
    branches: [research/seed17-fasttrack-codec-20261020]
    paths: [.github/workflows/seed17-fasttrack-calibration.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: seed17-fasttrack-isolated-judge
  cancel-in-progress: false
jobs:
  calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OUT: runs/judgments/fasttrack_cloud_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Fixed five invented calibration cases only
        id: calibration
        continue-on-error: true
        run: python tools/calibrate_seed17_judge.py --live-synthetic --output "$OUT"
      - name: Independently verify recorded live evidence against exact current fingerprints
        id: verify
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from research.seed17_judge_calibration import verify_calibration
          from research.integrity import read_json,digest
          root=Path.cwd();path=Path(os.environ['OUT'])/'calibration.json'
          record=read_json(path)
          passed=verify_calibration(root,record,require_live=True)
          print('VERIFIED_JUDGE_CALIBRATION',json.dumps({'passed':bool(passed),'fixtures':len(record['cases']),'all_passed':record['all_passed'],'sha256':digest(path),'protected_predictions_executed':record['protected_predictions_executed']}))
          assert passed and record['all_passed'] is True and len(record['cases'])==5
          assert record['protected_predictions_executed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-verified-cloud-judge-${{ github.run_id }}
          path: ${{ env.OUT }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail closed
        if: always()
        run: |
          test '${{ steps.calibration.outcome }}' = 'success'
          test '${{ steps.verify.outcome }}' = 'success'
