name: Seed17 invented live judge calibration
on:
  push:
    branches:
      - research/seed17-provider-ci-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-judge-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run five invented live semantic judge fixtures (no protected cases)
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Missing Actions GEMINI_API_KEY"; exit 1; fi
          python tools/calibrate_seed17_judge.py --live-synthetic --output "runs/judgments/cloud_judge_${{ github.run_id }}"
