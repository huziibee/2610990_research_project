name: Seed17 invented typed-schema full clarification probe

on:
  push:
    branches:
      - research/seed17-schema-isolation-20261020
    paths:
      - .github/workflows/seed17-fixed-schema-smoke.yml
      - tools/diagnose_seed17_fixed_smoke.py
      - tests/test_seed17_fixed_smoke_retry.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed17-invented-typed-schema-full-trajectory
  cancel-in-progress: false

jobs:
  invented-only:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DIAG_DIR: runs/provider_diagnostics/fixed_full_smoke_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline schema and evidence-path regression
        run: python -m unittest tests.test_seed17_schema_features tests.test_seed17_fixed_smoke_diag tests.test_seed17_fixed_smoke_retry -v
      - name: API secret configured
        run: test -n "$GEMINI_API_KEY"
      - name: Full invented two-answer S0/S1 diagnostics (NOT technical release evidence)
        id: candidate
        continue-on-error: true
        run: python tools/diagnose_seed17_fixed_smoke.py --output "$DIAG_DIR"
      - name: Report actual validity and failure stages
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["DIAG_DIR"])
          f=p/"summary.json"
          if f.is_file():
              x=json.loads(f.read_text(encoding="utf-8"))
              print("INVENTED_TWO_ANSWER_CANDIDATE",json.dumps(x,sort_keys=True))
          for record in sorted(p.glob("*/calls.json")):
              calls=json.loads(record.read_text(encoding="utf-8"))
              for c in calls:
                  keep=("stage","status","error_code","http_status","finish_reason","model_version")
                  print("CALL_STATUS",json.dumps({k:c.get(k) for k in keep},sort_keys=True))
          print("OFFICIAL_LIVE_SMOKE_QUALIFIED=FALSE; PROTECTED_PREDICTIONS_EXECUTED=FALSE")
          PY
      - name: Save full invented-only diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed17-invented-fixed-two-answer-${{ github.run_id }}
          path: ${{ env.DIAG_DIR }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Fail closed when candidate incomplete
        if: always()
        run: test "${{ steps.candidate.outcome }}" = "success"
