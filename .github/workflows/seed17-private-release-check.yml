name: Seed17 private approved reference validation
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: seed17-private-reference-validation
  cancel-in-progress: false
jobs:
  private-reference-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Secure staging and relocation regression tests
        run: python -m unittest tests.test_seed17_private_staging tests.test_seed17_portable_source_replay -v
      - name: Restore original encrypted references and verify exact author receipt and source hashes
        env:
          AUTHOR_REVIEW_AES_KEY_BASE64: ${{ secrets.AUTHOR_REVIEW_AES_KEY_BASE64 }}
        run: |
          python tools/stage_seed17_private_release.py
      - name: Explicit non-execution statement
        run: |
          echo 'REFERENCE_VALIDATION_ONLY: no model API calls, no protected predictions, no authorization.'
      # Deliberately no artifact upload: plaintext references remain on this
      # ephemeral runner only. The key is not available to any generation job.
