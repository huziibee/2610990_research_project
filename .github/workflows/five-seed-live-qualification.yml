name: Five-seed real qualification and release prerequisites
on:
  push:
    branches: [research/five-seed-finalization-20261020]
    paths: [.github/workflows/five-seed-live-qualification.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: five-seed-provider-qualification
  cancel-in-progress: false
jobs:
  invented-live-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      SMOKE: runs/development/five_seed_cloud_${{ github.run_id }}
      JUDGE: runs/judgments/five_seed_cloud_calibration_${{ github.run_id }}
      TOKENIZER: runs/readiness/five_seed_tokenizer_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Verify fixed source bytes and new profile tests before provider calls
        run: |
          python Data/verify_package.py
          python -m unittest tests.test_five_seed_execution tests.test_five_seed_quota tests.test_five_seed_token_count tests.test_five_seed_release -v
      - name: Official real paired S0/S1 two-answer clarification with no retries
        id: smoke
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/run_five_seed.py --live-smoke --output "$SMOKE"
      - name: Independently audit all nine actual calls and both trajectories
        id: smoke_audit
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.five_seed_release import verify_smoke
          report = verify_smoke(Path.cwd(), Path(os.environ['SMOKE']))
          print('OFFICIAL_CURRENT_CODE_SMOKE', json.dumps(report, sort_keys=True))
          PY
      - name: Fresh five-fixture live semantic judge calibration
        id: judge
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/calibrate_seed17_judge.py --live-synthetic --output "$JUDGE"
      - name: Independently verify exact judge code and durable fixture receipts
        id: judge_audit
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from research.integrity import read_json, digest
          from research.seed17_judge_calibration import verify_calibration
          p=Path(os.environ['JUDGE'])/'calibration.json'
          passed=verify_calibration(Path.cwd(),read_json(p),require_live=True)
          print('CURRENT_LIVE_JUDGE_CALIBRATION',json.dumps({'verified':passed,'sha256':digest(p)}))
          if not passed:raise SystemExit(2)
          PY
      - name: Test same-model tokenizer for oversized invented generation and judge inputs
        id: tokenizer
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/check_five_seed_tokenizer.py --live-synthetic --output "$TOKENIZER"
      - name: Preserve complete invented-only qualification and exact public source
        if: always()
        run: |
          mkdir -p runs/readiness/five_seed_source
          git archive --format=zip HEAD > runs/readiness/five_seed_source/source.zip
          git rev-parse HEAD > runs/readiness/five_seed_source/commit.txt
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('runs/readiness/five_seed_source/summary.json')
          p.write_text(json.dumps({'protected_predictions_executed':False,
             'scope':'LIVE_INVENTED_QUALIFICATION_ONLY','commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-seed-live-qualification-${{ github.run_id }}
          path: |
            ${{ env.SMOKE }}/
            ${{ env.JUDGE }}/
            ${{ env.TOKENIZER }}/
            runs/readiness/five_seed_source/
            runs/resource_ledgers/gemma_developer_api/
          retention-days: 14
          if-no-files-found: error
      - name: Fail closed on any incomplete live qualification
        if: always()
        run: |
          test '${{ steps.smoke.outcome }}' = success
          test '${{ steps.smoke_audit.outcome }}' = success
          test '${{ steps.judge.outcome }}' = success
          test '${{ steps.judge_audit.outcome }}' = success
          test '${{ steps.tokenizer.outcome }}' = success
          echo 'REAL_QUALIFICATION_PASSED; protected dataset not executed.'
  private-reference-prerequisite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Validate original private release using native repository secret only
        env:
          AUTHOR_REVIEW_AES_KEY_BASE64: ${{ secrets.AUTHOR_REVIEW_AES_KEY_BASE64 }}
        run: python tools/stage_seed17_private_release.py
      # No private artifact upload, no generation key and no model calls in this job.
