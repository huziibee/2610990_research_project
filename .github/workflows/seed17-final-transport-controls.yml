name: Seed17 full-pipeline control and reference staging
on:
  push:
    branches: [research/seed17-fasttrack-codec-20261020]
    paths: [.github/workflows/seed17-final-transport-controls.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: seed17-final-transport-controls
  cancel-in-progress: false
jobs:
  private_prerequisite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: 9ff608a0e8ebfd9d55d102df2c0b40430b2f355e}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Validate approved reference archive only if original decryption secret exists
        env:
          AUTHOR_REVIEW_AES_KEY_BASE64: ${{ secrets.AUTHOR_REVIEW_AES_KEY_BASE64 }}
        run: |
          if [ -z "$AUTHOR_REVIEW_AES_KEY_BASE64" ]; then
            echo 'BLOCKED: original AUTHOR_REVIEW_AES_KEY_BASE64 is not configured; no private references opened.'
            exit 2
          fi
          python tools/stage_seed17_private_release.py
      # No plaintext artifacts or private logs are uploaded.
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Strict canonical parser tests and both full oracle-process rehearsals
        run: |
          python -m unittest tests.test_seed17_plain_text_transport tests.test_seed17_canonical_json -v
          python tools/probe_seed17_canonical_json.py --mock --plain-text --attempts 1 --output runs/provider_diagnostics/plain_mock_${{ github.run_id }}
          python tools/probe_seed17_gemini_control.py --mock --output runs/provider_diagnostics/gemini_control_mock_${{ github.run_id }}
      - name: Gemma26 plain text with full schema in prompt and strict original validation
        id: plain
        continue-on-error: true
        run: python tools/probe_seed17_canonical_json.py --plain-text --attempts 1 --output runs/provider_diagnostics/plain_live_${{ github.run_id }}
      - name: Different supported model control, same candidate codec and orchestration
        id: control
        continue-on-error: true
        run: python tools/probe_seed17_gemini_control.py --output runs/provider_diagnostics/gemini_control_live_${{ github.run_id }}
      - name: Actual complete trajectories, distinct model identities and failures
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          for pattern in ('plain_live_*/summary.json','gemini_control_live_*/summary.json'):
              for f in Path('runs/provider_diagnostics').glob(pattern):
                  print('LIVE_CONTROL',f.read_text())
                  for path in f.parent.glob('*/calls.json'):
                      for row in json.loads(path.read_text()):
                          print('ACTUAL_CALL',json.dumps({k:row.get(k) for k in ('stage','status','model_version','finish_reason','error_code','http_status')},sort_keys=True))
          print('PROTECTED_RUNS_EXECUTED=False; MODEL_OR_TRANSPORT_ADOPTED_IN_STUDY=False')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-final-transport-controls-${{ github.run_id }}
          path: |
            runs/provider_diagnostics/plain_*/
            runs/provider_diagnostics/gemini_control_*/
          retention-days: 14
      - name: Report failure unless at least one complete candidate actually passed
        if: always()
        run: test '${{ steps.plain.outcome }}' = 'success' || test '${{ steps.control.outcome }}' = 'success'
