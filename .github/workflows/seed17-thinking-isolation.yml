name: Seed17 invented thinking config isolation

on:
  push:
    branches:
      - research/seed17-wire-isolation-20261020
    paths:
      - .github/workflows/seed17-thinking-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed17-invented-thinking-isolation
  cancel-in-progress: false

jobs:
  invented-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Offline complete request contract regression
        run: python -m unittest tests.test_seed17_wire_isolation -v
      - name: Secret check
        run: test -n "$GEMINI_API_KEY"
      - name: Baseline no thinkingConfig
        run: python tools/diagnose_seed17_wire_fields.py --live-synthetic --case direct_schema_no_thinking_config --output runs/provider_diagnostics/think_none_${{ github.run_id }}
      - name: thinkingLevel minimal only
        run: python tools/diagnose_seed17_wire_fields.py --live-synthetic --case direct_schema_thinking_level_only --output runs/provider_diagnostics/think_level_${{ github.run_id }}
      - name: includeThoughts false only
        run: python tools/diagnose_seed17_wire_fields.py --live-synthetic --case direct_schema_include_thoughts_only --output runs/provider_diagnostics/think_include_${{ github.run_id }}
      - name: Registered thinkingLevel and includeThoughts
        run: python tools/diagnose_seed17_wire_fields.py --live-synthetic --case direct_registered_schema --output runs/provider_diagnostics/think_registered_${{ github.run_id }}
      - name: Compare bounded task validation and thought usage
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("runs/provider_diagnostics").glob("think_*/summary.json")):
              j=json.loads(p.read_text(encoding="utf-8"))
              for row in j["cases"]:
                  keep=("variant","status","finish_reasons","code","http_status","output_token_count",
                        "thinking_token_count","valid_json","passes_local_task_validation","provider_diagnostics")
                  print("THINKING_COMPARISON",json.dumps({k:row.get(k) for k in keep},sort_keys=True))
          print("SYNTHETIC_DIAGNOSTIC_ONLY=TRUE; PROTECTED_PREDICTIONS=0")
          PY
      - name: Save invented only attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed17-thinking-isolation-${{ github.run_id }}
          path: runs/provider_diagnostics/think_*/
          retention-days: 14
          if-no-files-found: warn
