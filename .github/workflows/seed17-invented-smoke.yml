name: Seed17 invented multi-turn live smoke
on:
  push:
    branches:
      - research/seed17-provider-ci-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
      RUN_DIR: runs/development/cloud_seed17_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact project runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: One synthetic full two-answer test and redacted stage report
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Missing Actions GEMINI_API_KEY"; exit 1; fi
          set +e
          python tools/run_single_seed.py --live-smoke --output "$RUN_DIR"
          result=$?
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ["RUN_DIR"])
          rows=[]
          for p in sorted((base/"calls").glob("*.json")):
              try:
                  x=json.loads(p.read_text())
                  rows.append({k:x.get(k) for k in ("stage","status","error_code","http_status","model_version")})
              except (OSError,ValueError):
                  rows.append({"stage":"UNREADABLE_CALL"})
          print("REDACTED_CALL_STAGE_SUMMARY",json.dumps(rows,sort_keys=True))
          PY
          exit "$result"
