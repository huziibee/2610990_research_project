name: Seed17 portable source replay verification
on:
  push:
    branches: [research/seed17-portable-reference-replay-20261020]
    paths: [.github/workflows/seed17-portable-source-replay.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seed17-portable-source-replay
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
        with: {ref: research/seed17-portable-reference-replay-20261020}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Apply exact-source code patch without opening private references
        run: python tools/apply_seed17_portable_replay_patch.py
      - name: Full regression suite including relocation tampering tests
        run: |
          mkdir -p runs/readiness/portable-ci
          python -m unittest discover -s tests -v > runs/readiness/portable-ci/tests.log 2>&1 || { tail -n 100 runs/readiness/portable-ci/tests.log; exit 1; }
          tail -n 6 runs/readiness/portable-ci/tests.log
          python Data/verify_package.py
      - name: Prove protected source and review files are unchanged
        run: |
          git diff --check
          git diff --exit-code -- Data protocol/seed17 protected_reference_archive annotation/semantic_reference_template_100.jsonl
      - name: Commit tested implementation only to the candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/annotation_store.py tools/review_author_batch.py tools/archive_author_release.py research/seed17_author_review.py
          git diff --cached --stat
          git commit -m 'fix(seed17): replay identical pinned source bytes across checkout locations without rewriting author review'
          git push origin HEAD:research/seed17-portable-reference-replay-20261020
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-portable-source-regression-${{ github.run_id }}
          path: runs/readiness/portable-ci/tests.log
          retention-days: 14
