name: Seed17 synthetic S1 grounding capacity sweep
on:
  push:
    branches:
      - research/seed17-token-sweep-20261020
    paths:
      - .github/workflows/seed17-s1-token-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preregistered-distinct-caps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
      SWEEP_DIR: runs/provider_diagnostics/cap_sweep_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact project dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify local deterministic tests before live calls
        run: python -m unittest discover -s tests -q
      - name: Check secret binding
        run: test -n "$GEMINI_API_KEY"
      - name: Execute each distinct synthetic S1 grounding budget once
        run: python tools/ci_s1_token_sweep.py
      - name: Archive synthetic summaries and immutable receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-grounding-caps-${{ github.run_id }}
          path: ${{ env.SWEEP_DIR }}/
          retention-days: 14
          if-no-files-found: warn
