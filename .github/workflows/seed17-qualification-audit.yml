name: Seed17 evidence audit and bounded qualification
on:
  push:
    branches: [research/seed17-qualification-audit-20261020]
    paths: [.github/workflows/seed17-qualification-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: seed17-single-live-provider-owner
  cancel-in-progress: false
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: {PYTHONPATH: .}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Full tests, 200 main and 500 ablation mocks, and synthetic analysis
        run: python tools/validate_seed17_safe.py --output runs/readiness/continue_offline_${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-safe-summary-${{ github.run_id }}
          path: |
            runs/readiness/continue_offline_${{ github.run_id }}/safe_validation_summary.json
            runs/readiness/continue_offline_${{ github.run_id }}/readiness.json
            runs/readiness/continue_offline_${{ github.run_id }}/unittest.log
          retention-days: 14
  private_reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: 9ff608a0e8ebfd9d55d102df2c0b40430b2f355e}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Verify original author-reviewed archive without model access or artifact publication
        env:
          AUTHOR_REVIEW_AES_KEY_BASE64: ${{ secrets.AUTHOR_REVIEW_AES_KEY_BASE64 }}
        run: python tools/stage_seed17_private_release.py
      # No plaintext artifacts and no generation API key in this job.
  live_and_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      OUT: runs/provider_diagnostics/gemma_document_bounded_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Negative evidence tests and lossless parser tests
        run: python -m unittest tests.test_seed17_candidate_evidence_audit tests.test_seed17_json_document -v
      - name: Download previous complete Gemini control; do not repeat provider calls
        uses: actions/download-artifact@v4
        with:
          name: seed17-final-transport-controls-39463963042
          run-id: 39463963042
          github-token: ${{ github.token }}
          path: runs/provider_diagnostics/prior_verified_control
      - name: Independently audit the existing 9-call Gemini control with its true model identity
        run: |
          mkdir -p runs/readiness/continue_audit_${{ github.run_id }}
          python tools/audit_seed17_candidate_evidence.py runs/provider_diagnostics/prior_verified_control/gemini_control_live_39463963042 --expected-model gemini-3.5-flash-lite --output runs/readiness/continue_audit_${{ github.run_id }}/gemini_control_audit.json
      - name: Original Gemma candidate with tested lossless JSON fence decoding and bounded HTTP retries
        id: gemma
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY"
          python tools/probe_seed17_canonical_json.py --plain-text --allow-json-fence --attempts 3 --output "$OUT"
      - name: Strict first-attempt raw-evidence audit; retries must not look like clean qualification
        id: strict
        if: always()
        continue-on-error: true
        run: python tools/audit_seed17_candidate_evidence.py "$OUT" --expected-model gemma-4-26b-a4b-it --output runs/readiness/continue_audit_${{ github.run_id }}/gemma_candidate_audit.json
      - name: Report actual trajectories, retries and model failures
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['OUT'])
          if (root/'summary.json').is_file():
              print('ACTUAL_CANDIDATE_SUMMARY', (root/'summary.json').read_text())
          for file in root.glob('*/calls.json'):
              for call in json.loads(file.read_text()):
                  print('MODEL_CALL',json.dumps({k:call.get(k) for k in ('stage','status','model_version','finish_reason','error_code','http_status')},sort_keys=True))
          print('PROTECTED_PREDICTIONS_EXECUTED=False; FINAL_STUDY_FREEZE=False')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-candidate-audit-${{ github.run_id }}
          path: |
            runs/readiness/continue_audit_${{ github.run_id }}/
            runs/provider_diagnostics/gemma_document_bounded_${{ github.run_id }}/
          retention-days: 14
      - name: Fail honestly if original Gemma qualification is incomplete
        if: always()
        run: |
          test '${{ steps.gemma.outcome }}' = 'success'
          test '${{ steps.strict.outcome }}' = 'success'
