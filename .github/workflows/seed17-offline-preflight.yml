name: Seed17 complete offline technical preflight

on:
  push:
    branches:
      - research/seed17-offline-preflight-20261020
    paths:
      - .github/workflows/seed17-offline-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OUT: runs/readiness/ci_preflight_${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact regression dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify complete offline experimental machinery
        run: python tools/validate_seed17_safe.py --output "$OUT"
      - name: Print candidate status without treating a blocked gate as success
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["OUT"])
          summary=json.loads((root/"safe_validation_summary.json").read_text())
          report=json.loads((root/"readiness.json").read_text())
          print("OFFLINE_PREFLIGHT",json.dumps(summary,sort_keys=True))
          print("TECHNICAL_GATE_RESULT",json.dumps({
              "ready":report.get("ready"),
              "failed_gates":[x.get("gate") for x in report.get("failures",[])],
              "protected_predictions_executed":False
          },sort_keys=True))
          assert summary["safe_checks_passed"] is True
          assert summary["protected_predictions_executed"] is False
          assert summary["mock_initial_predictions"]==200
          PY
      - name: Persist only mock technical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed17-offline-preflight-${{ github.run_id }}
          path: |
            ${{ env.OUT }}/
          if-no-files-found: warn
          retention-days: 14
