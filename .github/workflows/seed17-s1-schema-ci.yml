name: Seed17 invented S1 schema comparison
on:
  push:
    branches:
      - research/seed17-provider-ci-20261020
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invented-s1-schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Two invented S1-ground schema probes, one attempt each
        run: python tools/ci_probe_s1_ground_schema.py
