name: Seed17 alternate Gemma backbone feasibility
on:
  push:
    branches: [research/seed17-fasttrack-codec-20261020]
    paths: [.github/workflows/seed17-alternate-backbone.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: seed17-alternate-backbone-feasibility
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt
      - name: Offline full two-answer rehearsal before any alternate-model call
        run: python tools/probe_seed17_alternate_gemma.py --mock --transport schema --output runs/provider_diagnostics/alternate_mock_${{ github.run_id }}
      - name: Gemma 31B with finite complete schema and lossless decoder
        id: schema
        continue-on-error: true
        run: python tools/probe_seed17_alternate_gemma.py --transport schema --output runs/provider_diagnostics/alternate_schema_${{ github.run_id }}
      - name: Gemma 31B canonical JSON only if schema compilation failed
        id: canonical
        if: steps.schema.outcome != 'success'
        continue-on-error: true
        run: python tools/probe_seed17_alternate_gemma.py --transport canonical --output runs/provider_diagnostics/alternate_canonical_${{ github.run_id }}
      - name: Print actual provider identities and trajectory outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('runs/provider_diagnostics').glob('alternate_*/summary.json')):
              j=json.loads(p.read_text());print('ALTERNATE_RESULT',json.dumps(j,sort_keys=True))
              for c in p.parent.glob('*/calls.json'):
                  rows=json.loads(c.read_text())
                  for r in rows:
                      print('ACTUAL_MODEL',json.dumps({k:r.get(k) for k in ('stage','status','model_version','finish_reason','error_code','http_status')},sort_keys=True))
          print('REGISTERED_GEMMA26_STUDY_UNCHANGED=True; PROTECTED_PREDICTIONS=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed17-alternate-backbone-${{ github.run_id }}
          path: runs/provider_diagnostics/alternate_*/
          retention-days: 14
      - name: Do not claim success when both candidates fail
        if: always()
        run: test '${{ steps.schema.outcome }}' = 'success' || test '${{ steps.canonical.outcome }}' = 'success'
