name: Seed17 invented provider schema matrix

on:
  push:
    branches:
      - research/seed17-provider-schema-matrix-20261020
    paths:
      - .github/workflows/seed17-provider-schema-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed17-invented-provider-comparison
  cancel-in-progress: false

jobs:
  invented-provider-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python Data/verify_package.py
      - name: Check secret is available without disclosing it
        run: test -n "$GEMINI_API_KEY"
      - name: Registered goal-stage schema (invented fixture)
        id: goal
        continue-on-error: true
        run: python tools/diagnose_seed17_provider.py --case goal_contract --live-synthetic --output runs/provider_diagnostics/cloud_goal_${{ github.run_id }}
      - name: Registered full direct schema (invented fixture)
        id: full
        continue-on-error: true
        run: python tools/diagnose_seed17_provider.py --case direct_initial_contract --live-synthetic --output runs/provider_diagnostics/cloud_full_${{ github.run_id }}
      - name: Shallow top-level structured schema (diagnostic only)
        id: shallow
        continue-on-error: true
        run: python tools/diagnose_seed17_light_schema.py --live-synthetic --output runs/provider_diagnostics/cloud_shallow_${{ github.run_id }}
      - name: JSON MIME without provider schema (diagnostic only)
        id: json
        continue-on-error: true
        run: python tools/diagnose_seed17_provider.py --case direct_json_mode_no_schema --live-synthetic --output runs/provider_diagnostics/cloud_json_${{ github.run_id }}
      - name: Non-sensitive diagnostic summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("runs/provider_diagnostics").glob("cloud_*_*/result.json")):
              try:
                  d=json.loads(p.read_text(encoding="utf-8"))
                  print("PROBE",json.dumps({key:d.get(key) for key in
                      ("case","wire_schema_mode","status","code","http_status","provider_diagnostics",
                       "protected_predictions_executed")},sort_keys=True))
              except (ValueError,OSError) as exc:
                  print("PROBE_READ_ERROR",type(exc).__name__)
          PY
      - name: Keep immutable invented-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed17-provider-schema-matrix-${{ github.run_id }}
          path: runs/provider_diagnostics/cloud_*/
          retention-days: 14
          if-no-files-found: warn
      - name: Explicitly mark as diagnostics and not release evidence
        if: always()
        shell: bash
        run: |
          echo "PROTECTED_PREDICTIONS_EXECUTED=FALSE"
          echo "THIS MATRIX DOES NOT QUALIFY LIVE TWO-ANSWER SMOKE OR AUTHORIZE A PROTOCOL CHANGE."
          echo "goal: ${{ steps.goal.outcome }}; full: ${{ steps.full.outcome }}; shallow: ${{ steps.shallow.outcome }}; json: ${{ steps.json.outcome }}"
